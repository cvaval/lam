name: Sauvegarde de la base

# Sauvegarde planifiée de la base de PRODUCTION, indépendante du Mac (audit 22 juil. 2026).
# Tourne dans le cloud GitHub : dump chiffré (AES-256) déposé hors-site sur Cloudflare R2,
# et conservé en secours comme artefact GitHub chiffré. Le dump contient des données
# sensibles (mots de passe hachés, secrets 2FA) — d'où le chiffrement systématique avant
# tout stockage. La restauration exige la phrase de passe BACKUP_PASSPHRASE.
#
# Secrets requis (Settings → Secrets and variables → Actions) :
#   DATABASE_BACKUP_URL  — la DIRECT_URL Supabase (port 5432), OBLIGATOIRE
#   BACKUP_PASSPHRASE    — phrase de passe forte pour chiffrer/déchiffrer, OBLIGATOIRE
#   R2_ACCOUNT_ID        — id de compte Cloudflare (optionnel : sans lui, seul l'artefact GitHub sert)
#   R2_BUCKET            — nom du bucket R2
#   R2_ACCESS_KEY_ID     — clé S3 R2 (jeton R2 « Object Read & Write »)
#   R2_SECRET_ACCESS_KEY — secret S3 R2
#
# Restauration d'un dump chiffré :
#   gpg --batch --passphrase '…' -o lam.dump -d lam-AAAA-MM-JJ.dump.gpg
#   pg_restore --clean --if-exists --no-owner --no-privileges -d "$URL_CIBLE" lam.dump

on:
  schedule:
    - cron: '0 7 * * *'   # 07:00 UTC quotidien (~03:00 heure de l'Est)
  workflow_dispatch: {}    # bouton « Run workflow » pour un test manuel

concurrency:
  group: db-backup
  cancel-in-progress: false

permissions:
  contents: read
  issues: write   # pour ouvrir une alerte quand la sauvegarde échoue (voir la dernière étape)

jobs:
  backup:
    runs-on: ubuntu-latest
    env:
      DB_URL: ${{ secrets.DATABASE_BACKUP_URL }}
      PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      # aws-cli v2 récent envoie des en-têtes de somme de contrôle que R2 refuse parfois.
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
    steps:
      - name: Vérifier les secrets obligatoires
        run: |
          test -n "$DB_URL"      || { echo "::error::secret DATABASE_BACKUP_URL manquant"; exit 1; }
          test -n "$PASSPHRASE"  || { echo "::error::secret BACKUP_PASSPHRASE manquant"; exit 1; }

      - name: Dump + contrôle d'intégrité + chiffrement
        run: |
          set -euo pipefail
          STAMP=$(date -u +%F)
          OUT="lam-$STAMP.dump"
          # Nettoyage défensif de l'URL : une valeur collée depuis .env peut arriver entourée
          # de guillemets ou avec un saut de ligne, ce qui fait échouer pg_dump avec
          # « invalid connection option ». On retire retours-chariot, espaces et guillemets
          # encadrants avant usage.
          DB_URL="$(printf '%s' "$DB_URL" | tr -d '\r\n')"
          DB_URL="${DB_URL#"${DB_URL%%[![:space:]]*}"}"   # trim gauche
          DB_URL="${DB_URL%"${DB_URL##*[![:space:]]}"}"   # trim droite
          DB_URL="${DB_URL#\"}"; DB_URL="${DB_URL%\"}"    # guillemets doubles encadrants
          DB_URL="${DB_URL#\'}"; DB_URL="${DB_URL%\'}"    # guillemets simples encadrants
          case "$DB_URL" in
            postgres://*|postgresql://*) : ;;
            *) echo "::error::DATABASE_BACKUP_URL ne commence pas par postgresql:// (valeur mal collée ?)"; exit 1 ;;
          esac
          # Keepalives : sans eux le pooler Supabase coupe la connexion SSL en cours de dump
          # sur une grosse table (« SSL connection has been closed unexpectedly »).
          SEP=$([ "${DB_URL#*\?}" != "$DB_URL" ] && echo '&' || echo '?')
          CONN="${DB_URL}${SEP}keepalives=1&keepalives_idle=20&keepalives_interval=10&keepalives_count=15"
          # pg_dump 17 via l'image officielle (le serveur Supabase est en 17.x, pg_dump doit
          # être >= au serveur). Docker est préinstallé sur le runner : plus d'installation
          # fragile de client PostgreSQL. Le dump + le contrôle d'intégrité tournent dans le
          # conteneur (pg_restore 17) ; le fichier atterrit sur l'hôte via le montage /work.
          # En cas de dump incomplet (échecs des 26-27 juil. : « table Document absente »
          # alors que la même commande locale est saine), on IMPRIME le listing de
          # l'archive pour voir ce qui a réellement été sauvegardé (noms de tables
          # seulement — rien de sensible), puis on retente UNE fois après 60 s.
          dump_once() {
            docker run --rm -e DB="$CONN" -e OUT="$OUT" -v "$PWD:/work" -w /work postgres:17 \
              bash -euo pipefail -c '
                rm -f "$OUT"
                pg_dump "$DB" -Fc --no-owner --no-privileges -f "$OUT"
                # ⚠ NE JAMAIS canaliser pg_restore --list DANS grep -q SOUS pipefail.
                # grep -q sort dès la PREMIÈRE correspondance et ferme le tuyau ; pg_restore
                # reçoit alors SIGPIPE et rend 141 ; pipefail propage ce 141 au pipeline, et
                # un dump PARFAITEMENT VALIDE est déclaré incomplet. Ce défaut d une ligne a
                # fait échouer 21 des 29 sauvegardes entre le 23 juillet et le 16 août 2026,
                # dont dix jours consécutifs — les dumps étaient bons, le contrôle mentait.
                # (Le bloc de diagnostic, lui, ne passait pas -q : il imprimait donc la table
                # Document juste sous le message annonçant son absence. Personne ne l a lu.)
                # On matérialise le listing, puis on le lit sans tuyau.
                pg_restore --list "$OUT" > listing.txt || { echo "::warning::archive illisible"; exit 1; }
                if ! grep -q "TABLE DATA public Document " listing.txt; then
                  echo "::warning::table Document absente du listing — diagnostic :"
                  echo "— taille de l archive : $(du -h "$OUT" | cut -f1)"
                  echo "— entrées TABLE DATA présentes :"
                  grep "TABLE DATA" listing.txt || echo "  (aucune)"
                  echo "— 40 premières lignes du listing :"
                  head -40 listing.txt
                  rm -f listing.txt
                  exit 1
                fi
                # Contrôle de FOND, pas seulement de forme : une archive peut lister la table
                # et ne contenir aucune ligne. On exige un plancher de taille.
                TAILLE=$(stat -c %s "$OUT")
                if [ "$TAILLE" -lt 5000000 ]; then
                  echo "::warning::archive de $TAILLE octets — sous le plancher de 5 Mo"
                  rm -f listing.txt
                  exit 1
                fi
                echo "Dump OK : $(du -h "$OUT" | cut -f1) · $(grep -c "TABLE DATA public" listing.txt) tables publiques"
                rm -f listing.txt
              '
          }
          if ! dump_once; then
            echo "::warning::1re tentative incomplète — nouvelle tentative dans 60 s"
            sleep 60
            dump_once || { echo "::error::dump incomplet après 2 tentatives (diagnostic ci-dessus)"; exit 1; }
          fi
          # Chiffrement symétrique AES-256 sur l'hôte (gnupg préinstallé) avant tout stockage.
          gpg --batch --yes --pinentry-mode loopback --passphrase "$PASSPHRASE" \
            --cipher-algo AES256 -c "$OUT"
          rm -f "$OUT"
          ls -la "$OUT.gpg"
          echo "STAMP=$STAMP" >> "$GITHUB_ENV"

      - name: Artefact GitHub chiffré (destination de secours, toujours)
        uses: actions/upload-artifact@v4
        with:
          name: lam-backup-${{ env.STAMP }}
          path: lam-${{ env.STAMP }}.dump.gpg
          retention-days: 30
          if-no-files-found: error

      - name: Envoi vers Cloudflare R2 (si configuré)
        if: ${{ env.R2_ACCOUNT_ID != '' && env.R2_BUCKET != '' }}
        run: |
          set -euo pipefail
          test -n "$AWS_ACCESS_KEY_ID" && test -n "$AWS_SECRET_ACCESS_KEY" \
            || { echo "::error::R2_ACCESS_KEY_ID / R2_SECRET_ACCESS_KEY manquants"; exit 1; }
          ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          # R2 est compatible S3 ; aws-cli est préinstallé sur le runner.
          aws s3 cp "lam-${STAMP}.dump.gpg" "s3://${R2_BUCKET}/lam-${STAMP}.dump.gpg" \
            --endpoint-url "$ENDPOINT" --only-show-errors
          echo "✓ Déposé sur R2 : s3://${R2_BUCKET}/lam-${STAMP}.dump.gpg"
          # Rotation : ne garder que les 30 dumps R2 les plus récents.
          aws s3 ls "s3://${R2_BUCKET}/" --endpoint-url "$ENDPOINT" \
            | awk '{print $4}' | grep -E '^lam-.*\.dump\.gpg$' | sort | head -n -30 \
            | while read -r old; do
                [ -n "$old" ] && aws s3 rm "s3://${R2_BUCKET}/${old}" --endpoint-url "$ENDPOINT" --only-show-errors
              done

      # ─────────────────────────────────────────────────────────────────────────
      # ALERTE — la cause profonde des 21 échecs silencieux (23 juil. → 16 août 2026)
      # n'était pas le défaut de shell : c'était que RIEN N'AVERTISSAIT. Le flux
      # tournait, échouait, et personne ne le savait. Un filet dont la rupture est
      # muette n'est pas un filet.
      #
      # Une alerte est ouverte en ISSUE : visible sans configurer de secret, elle
      # apparaît dans l'onglet Issues et déclenche la notification GitHub habituelle.
      # Une seule issue ouverte à la fois — un échec de dix jours ne doit pas produire
      # dix alertes, mais une seule qu'on ne peut pas manquer.
      - name: Alerte si la sauvegarde a échoué
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const titre = '⚠️ La sauvegarde de la base a échoué'
            const { data: ouvertes } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'sauvegarde',
            })
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            const corps = [
              `La sauvegarde quotidienne de la base de production a échoué le ${new Date().toISOString().slice(0, 10)}.`,
              '',
              `Journal : ${url}`,
              '',
              '**Tant que cette alerte est ouverte, la base n\'est pas sauvegardée.**',
              'Refermer cette issue une fois la cause corrigée et une exécution manuelle réussie',
              '(onglet Actions → « Sauvegarde de la base » → « Run workflow »).',
            ].join('\n')
            if (ouvertes.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: ouvertes[0].number, body: `Nouvel échec.\n\nJournal : ${url}`,
              })
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title: titre, body: corps, labels: ['sauvegarde'],
              })
            }
